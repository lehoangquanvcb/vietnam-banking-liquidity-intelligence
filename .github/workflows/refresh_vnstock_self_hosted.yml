name: Refresh Bronze Liquidity Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: "15 1 * * 1-5"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Refresh and model
        shell: powershell
        run: |
          $py="$env:USERPROFILE\.venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { throw "Bronze Python not found" }
          & $py scripts/refresh_bronze.py
          & $py scripts/build_models.py
      - name: Commit outputs
        shell: powershell
        run: |
          git config user.name "vnstock-liquidity-bot"
          git config user.email "vnstock-liquidity-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Automated Bronze refresh and model build"
          git push
